[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-note-agent"
version = "0.1.0"
description = "把一句话知识点扩写成技术博客风格笔记，评分审阅后写入飞书"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "langgraph>=0.2.60,<1.0",
    "langgraph-checkpoint-sqlite>=2.0.0,<3.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "markdown-it-py>=3.0",
    "typer>=0.12",
    "lark-oapi>=1.6.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
note-agent = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
